name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=line,json
        env:
          VERIFY_BASEMAP: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: basemap-evidence/results.json
      - name: Check original tile and screenshot for API-key watermark
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python scripts/verify_basemap_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basemap-verification
          path: basemap-evidence/
          retention-days: 7
